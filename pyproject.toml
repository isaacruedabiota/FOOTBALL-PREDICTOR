[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footy-predictor"
version = "0.1.0"
description = "Modelo predictivo de fútbol (Dixon-Coles) con registro y evaluación de predicciones"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "scipy>=1.11",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
footy = "footy.cli:main"

[tool.setuptools]
packages = ["footy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
